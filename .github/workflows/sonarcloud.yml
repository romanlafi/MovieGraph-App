name: Quality and coverage

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, frontend checks and SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            back/requirements.txt
            requirements-test.txt

      - name: Install backend test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run backend tests with coverage
        env:
          PYTHONPATH: back
        run: |
          python -m coverage erase
          python -m coverage run -m unittest discover -s back/tests -v
          python -m coverage combine
          python -m coverage xml
          python -m coverage report

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix front ci

      - name: Lint frontend
        run: npm --prefix front run lint

      - name: Build frontend
        run: npm --prefix front run build

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

      - name: Analyze with SonarCloud
        if: >-
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
          (github.ref == 'refs/heads/main' || github.base_ref == 'main' || vars.SONAR_BRANCH_ANALYSIS == 'true')
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
